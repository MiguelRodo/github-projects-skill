name: Repair issue 200 branch

on:
  push:
    branches:
      - issue-200-standard-backlog-view

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-200-standard-backlog-view
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Restore stale checks and duplicate recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/githubcli/project_view_setup.go')
          text = path.read_text()
          text = text.replace('\t"fmt"\n\t"strconv"', '\t"fmt"\n\t"reflect"\n\t"strconv"', 1)

          start = text.index('func planBacklogViewChanges(')
          end = text.index('func planStandardBacklogViewFromState', start)
          text = text[:start] + '''func planBacklogViewChanges(views []projectViewNode, spec backlogViewSpec) ([]StandardBacklogViewChange, error) {
\tbacklogs := findBacklogViews(views)
\tif len(backlogs) == 0 {
\t\treturn []StandardBacklogViewChange{{Action: "create_view", Detail: "table; group Status; sort Priority ascending"}}, nil
\t}
\tvar exact []projectViewNode
\tfor _, view := range backlogs {
\t\tif backlogViewMatches(view, spec) {
\t\t\texact = append(exact, view)
\t\t}
\t}
\tif len(backlogs) > 1 {
\t\tif len(exact) == 0 {
\t\t\treturn nil, fmt.Errorf("Project has %d Backlog views and none matches the standard profile; refusing ambiguous reconciliation", len(backlogs))
\t\t}
\t\tcanonical := exact[0]
\t\tfor _, candidate := range exact[1:] {
\t\t\tif candidate.Number < canonical.Number {
\t\t\t\tcanonical = candidate
\t\t\t}
\t\t}
\t\tvar changes []StandardBacklogViewChange
\t\tfor _, view := range backlogs {
\t\t\tif view.ID == canonical.ID {
\t\t\t\tcontinue
\t\t\t}
\t\t\tchanges = append(changes, StandardBacklogViewChange{Action: "delete_duplicate_view", ViewID: view.ID, Detail: fmt.Sprintf("keep standard Backlog view #%d", canonical.Number)})
\t\t}
\t\treturn changes, nil
\t}
\tview := backlogs[0]
\tif backlogViewMatches(view, spec) {
\t\treturn nil, nil
\t}
\tif backlogViewGroupSortMatches(view, spec) {
\t\treturn []StandardBacklogViewChange{{Action: "update_view", ViewID: view.ID, Detail: "table/filter/visible fields"}}, nil
\t}
\treturn []StandardBacklogViewChange{{Action: "replace_view", ViewID: view.ID, Detail: "GitHub API cannot update group/sort configuration in place"}}, nil
}

''' + text[end:]

          start = text.index('func unrelatedViewIDs(')
          end = text.index('func verifyBacklogByID', start)
          text = text[:start] + '''func unrelatedViews(views []projectViewNode) map[string]projectViewNode {
\tresult := make(map[string]projectViewNode)
\tfor _, view := range views {
\t\tif !strings.EqualFold(strings.TrimSpace(view.Name), standardBacklogViewName) {
\t\t\tresult[view.ID] = view
\t\t}
\t}
\treturn result
}

func verifyUnrelatedViews(before map[string]projectViewNode, after []projectViewNode) error {
\tafterMap := unrelatedViews(after)
\tfor id, old := range before {
\t\tcurrent, ok := afterMap[id]
\t\tif !ok {
\t\t\treturn fmt.Errorf("unrelated Project view %q (%s) disappeared during Backlog reconciliation", old.Name, id)
\t\t}
\t\tif !reflect.DeepEqual(old, current) {
\t\t\treturn fmt.Errorf("unrelated Project view %q (%s) changed during Backlog reconciliation", old.Name, id)
\t\t}
\t}
\treturn nil
}

''' + text[end:]

          old = '''func ApplyStandardBacklogView(ctx context.Context, runner Runner, project contract.Project) (StandardBacklogViewResult, error) {
\tstate, err := inspectStandardBacklogView(ctx, runner, project)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, err
\t}
\tplan, err := planStandardBacklogViewFromState(project, state)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, err
\t}
\tbeforeUnrelated := unrelatedViewIDs(state.views)

\tfor _, change := range plan.Changes {'''
          new = '''func ApplyStandardBacklogView(ctx context.Context, runner Runner, project contract.Project) (StandardBacklogViewResult, error) {
\tinitialState, err := inspectStandardBacklogView(ctx, runner, project)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, err
\t}
\tinitialPlan, err := planStandardBacklogViewFromState(project, initialState)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, err
\t}
\tfreshState, err := inspectStandardBacklogView(ctx, runner, project)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, fmt.Errorf("fresh pre-write inspection: %w", err)
\t}
\tfreshPlan, err := planStandardBacklogViewFromState(project, freshState)
\tif err != nil {
\t\treturn StandardBacklogViewResult{}, err
\t}
\tif !reflect.DeepEqual(initialState, freshState) || !reflect.DeepEqual(initialPlan, freshPlan) {
\t\treturn StandardBacklogViewResult{}, fmt.Errorf("Backlog view or field state changed after planning; inspect again before applying")
\t}
\tstate := freshState
\tplan := freshPlan
\tbeforeUnrelated := unrelatedViews(state.views)

\tfor _, change := range plan.Changes {'''
          if old not in text:
              raise SystemExit('ApplyStandardBacklogView preamble not found')
          text = text.replace(old, new, 1)

          old = '''\t\tcase "replace_view":
\t\t\tcreatedID, err := createBacklogView(ctx, runner, project, state)
\t\t\tif err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, err
\t\t\t}
\t\t\tviews, err := queryProjectViews(ctx, runner, project, state.ownerType)
\t\t\tif err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("verify replacement Backlog view before deleting the old view: %w", err)
\t\t\t}
\t\t\tif err := verifyBacklogByID(views, createdID, state.spec); err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("old Backlog view was preserved: %w", err)
\t\t\t}
\t\t\tif err := deleteProjectView(ctx, runner, change.ViewID); err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("replacement Backlog view %s is verified but old view %s could not be removed; rerun reconciliation: %w", createdID, change.ViewID, err)
\t\t\t}
\t\tdefault:'''
          new = '''\t\tcase "replace_view":
\t\t\tcreatedID, err := createBacklogView(ctx, runner, project, state)
\t\t\tif err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, err
\t\t\t}
\t\t\tviews, err := queryProjectViews(ctx, runner, project, state.ownerType)
\t\t\tif err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("verify replacement Backlog view before deleting the old view: %w", err)
\t\t\t}
\t\t\tif err := verifyBacklogByID(views, createdID, state.spec); err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("old Backlog view was preserved: %w", err)
\t\t\t}
\t\t\tif err := deleteProjectView(ctx, runner, change.ViewID); err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, fmt.Errorf("replacement Backlog view %s is verified but old view %s could not be removed; rerun reconciliation: %w", createdID, change.ViewID, err)
\t\t\t}
\t\tcase "delete_duplicate_view":
\t\t\tif err := deleteProjectView(ctx, runner, change.ViewID); err != nil {
\t\t\t\treturn StandardBacklogViewResult{}, err
\t\t\t}
\t\tdefault:'''
          if old not in text:
              raise SystemExit('replace_view switch block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          gofmt -w internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          git diff --check
          go test ./internal/githubcli
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          git commit -m 'Restore Backlog reconciliation safety (#200)'
          git push origin HEAD:issue-200-standard-backlog-view
