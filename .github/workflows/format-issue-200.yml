name: Format issue 200 branch

on:
  push:
    branches:
      - issue-200-standard-backlog-view

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-200-standard-backlog-view
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fix view delete readback and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/githubcli/project_view_setup.go')
          text = path.read_text()
          old = 'deleteProjectV2View(input: {viewId: $viewId}) { projectV2 { id } }'
          new = 'deleteProjectV2View(input: {viewId: $viewId}) { projectV2View { id } }'
          if old not in text:
              raise SystemExit('expected deleteProjectV2View selection not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          git commit -m 'Format Backlog view setup (#200)'
          git push origin HEAD:issue-200-standard-backlog-view
