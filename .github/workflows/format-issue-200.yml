name: Format issue 200 branch

on:
  push:
    branches:
      - issue-200-standard-backlog-view

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-200-standard-backlog-view
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/githubcli/project_view_setup.go internal/githubcli/project_view_setup_test.go
          git commit -m 'Format Backlog view setup (#200)'
          git push origin HEAD:issue-200-standard-backlog-view
