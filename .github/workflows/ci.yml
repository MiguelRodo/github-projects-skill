name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f LICENSE
          test -f docs/architecture/v1-boundaries.md
          test -f skills/github-projects/SKILL.md
          test -f AGENTS.md
          test -f .projects/project.md
          test -f skills/github-projects/references/local-implementation-queue.md
          test ! -e .github/workflows/project-admin-bridge.yml

      - name: Test projects CLI
        run: go test -race ./...

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet projects CLI
        run: go vet ./...

      - name: Build projects CLI
        run: go build ./cmd/projects

      - name: Test github-projects skill
        shell: bash
        run: bash skills/github-projects/tests/run.sh

      - name: Test local implementation queue
        shell: bash
        run: bash skills/github-projects/tests/local-implementation-queue-static.sh

      - name: Validate this repository's Project contract
        shell: bash
        run: bash skills/github-projects/scripts/validate-contract.sh .

      - name: Check whitespace
        run: git diff --check
